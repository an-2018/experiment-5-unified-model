  headline: true
  statement: >
    Subject-level bootstrap delta (degeneracy-controlled profile minus
    matched-dim random projection, averaged across 5 seeds' fixed
    predictions within each of 2000 resamples of the 47 test participants).
    THIS is the headline inversion statistic: it propagates both
    training-randomness (via the 5 seeds) and subject-sampling uncertainty
    (via the bootstrap), unlike C-INTERVAL-DELTA-CROSSSEED-CI below.
