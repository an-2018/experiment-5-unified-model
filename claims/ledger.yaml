# Claim Ledger (SPEC-H8-01/H8-03), full version.
#
# Every numeric or quantified statement destined for the manuscript is
# registered here, wired to the actual artifacts/stats/*.json files this
# session produced. No hand-typed numerals in Results; every LaTeX macro
# is generated from a `value`/`pointer` in this file, and `verify_claims.py`
# must be green before a line of prose is written (H8-03).
#
# Kinds:
#   scalar      - a single value, read from source/pointer, printed for the
#                 LaTeX macro generator. May carry a `tolerance` to catch
#                 upstream drift if the underlying artifact changes.
#   interval    - a value + 95% CI, with an optional `requires` directional
#                 check (e.g. entirely_below_zero, excludes_chance).
#   assertion   - a named check function in verify_claims.py's CHECKS
#                 registry (bespoke logic: sample-id consistency, checkpoint
#                 freshness, textual hedging scans of the compiled .tex).
#   quarantined - a literal number that is NOT a live claim. It may appear in
#                 the manuscript ONLY inside the section named by
#                 `required_label`; the linter fails the build if it's found
#                 anywhere else (or found nowhere, meaning it was silently
#                 dropped instead of disclosed).
#
# Blocking statuses: any entry with `status` set to a TODO_* value fails the
# verifier regardless of its kind. This is deliberate — see C-DELTA-BOOTSTRAP,
# C-MPDD-STRATIFIED (both resolved in this pass) and C-ROUTING-TABLE1 (still
# blocked, needs a real ~25-run 5-seed rerun of the graph-routing ladder,
# not yet done).

