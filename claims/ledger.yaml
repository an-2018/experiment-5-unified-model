- id: A-HOMOPHILY-FRESH
  kind: assertion
  check: file_exists
  statement: >
    RESOLVED 2026-07-28. Originally: the homophily diagnostic's checkpoint_sha
    must match Table 1's current model, blocked pending the routing rerun.
    Superseded once the rerun completed and a deeper issue was found:
    scripts/diagnose_graph_homophily.py (and phase07_joint_training.py's real
    graph construction) build the routing graph over a SEPARATE, untrained,
    randomly-initialized fusion projection, not any trained checkpoint's own
    representation -- so "freshness" in the original checkpoint-hash sense
    doesn't apply to that path. Fixed instead: the untrained-embedding
    diagnostic was unseeded (a different random draw every run); it now
    accepts --seed and is averaged over the same 5 canonical seeds as
    everything else (artifacts/stats/homophily_untrained_embedding_5seed_aggregate.json).
    A supplementary diagnostic (artifacts/stats/homophily_trained_representation.json)
    additionally recomputes the same metric on each trained checkpoint's own
    representation, disclosed as a distinct, secondary analysis -- see
    artifacts/homophily_methodology_report.md for the full account.
  args:
    paths:
      - artifacts/stats/homophily_untrained_embedding_5seed_aggregate.json
      - artifacts/stats/homophily_trained_representation.json
      - artifacts/homophily_methodology_report.md

- id: A-DELONG-NOT-SUPPORT
  kind: assertion
  check: tex_forbidden_phrase_near
  statement: >
    The compiled manuscript must not describe C-SCALAR-DELONG-SIGRATE
    (10/100) as confirming or supporting the inversion — it must appear only
    as an acknowledged power limitation.
  args:
    forbidden_phrases: ["DeLong.{0,80}(confirms|supports|establishes)", "(confirms|supports|establishes).{0,80}DeLong"]
    tex_files: [paper/main-conference.tex, paper/supplementary.tex, paper/journal_paper.tex]

- id: A-INDOMAIN-HEDGED
  kind: assertion
  check: tex_forbidden_phrase_near
  statement: >
    The compiled manuscript must not claim the in-domain control "rules out"
    domain shift unhedged — C-INTERVAL-INDOMAIN-PROFILE and
    C-INTERVAL-INDOMAIN-RP's CIs overlap substantially, so this is
